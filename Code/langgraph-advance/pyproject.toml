[project]
name = "enterprise-product-support-agent"
version = "0.3.0"
description = "LangGraph-based data agent for business intelligence queries"
requires-python = ">=3.11"
authors = [{name = "Anuraj"}]

dependencies = [
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=0.0.1",
    "databricks-sql-connector>=3.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
